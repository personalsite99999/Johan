      body {

      /* TV Frame Style - As Requested */
      .tv-frame {
        position: relative;
        background: #2c2c2c;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0,0,0,0.5);
        border: 2px solid #334155;
        transition: all 0.3s ease;
      }
      
      .tv-frame:hover {
        box-shadow: 0 0 40px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
        transform: translateY(-5px);
        border-color: #00f3ff;
      }

      .tv-screen {
        position: relative;
        background: #000;
        border-radius: 5px;
        overflow: hidden;
        padding-top: 56.25%; /* 16:9 Aspect Ratio */
        box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      }
      
      .tv-screen iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .tv-stand {
        width: 30%;
        height: 15px;
        background: #1e1e1e;
        margin: 0 auto;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        border: 1px solid #333;

    <!-- 🎶 MUSIC CONTROLLER -->
    <script>
      const music = document.getElementById("bg-music");

      function playMusicOnce() {
        music.volume = 0.4; // volume 40%
        music.play().catch(() => {});
        document.removeEventListener("click", playMusicOnce);
      }

      document.addEventListener("click", playMusicOnce);
    </script>
